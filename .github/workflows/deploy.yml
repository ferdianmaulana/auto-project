name: Deploy to Lighthouse

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/project-pipeline

            # Fix permissions
            sudo chown -R ubuntu:ubuntu ~/project-pipeline
            sudo chown -R 50000:0 ~/project-pipeline/airflow/logs
            sudo chmod -R 775 ~/project-pipeline/airflow/logs

            # Pull latest code
            git pull origin main

            # Write GCP credentials
            echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > ~/project-pipeline/gcp-credentials.json

            # Write env file
            echo "AIRFLOW_SECRET_KEY=${{ secrets.AIRFLOW_SECRET_KEY }}" > ~/project-pipeline/.env
            echo "AUTO_API_URL=${{ secrets.AUTO_API_URL }}" >> ~/project-pipeline/.env

            # Stop all containers
            sudo docker compose down

            # Rebuild image from scratch
            sudo docker compose build --no-cache

            # Re-initialize airflow DB
            sudo docker compose up airflow-init

            # Start all services
            sudo docker compose up -d

            echo "Deployment complete!"